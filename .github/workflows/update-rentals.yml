name: Update rentals snapshot

on:
  # 09:00 / 14:00 / 20:00 JST
  schedule:
    - cron: '0 0,5,11 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages per city × source (keep small to avoid load)'
        required: false
        default: '2'
        type: string
      delay:
        description: 'Delay between requests (ms)'
        required: false
        default: '1800'
        type: string
      sources:
        description: 'Sources: suumo,yahoo,athome'
        required: false
        default: 'suumo,yahoo'
        type: string
      enrich_only:
        description: 'Only recompute coords / car minutes (no scrape)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-rentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch / enrich listings
        env:
          PAGES: ${{ github.event.inputs.pages || '2' }}
          DELAY: ${{ github.event.inputs.delay || '1800' }}
          SOURCES: ${{ github.event.inputs.sources || 'suumo,yahoo,athome' }}
          ENRICH_ONLY: ${{ github.event.inputs.enrich_only || 'false' }}
        run: |
          if [ "$ENRICH_ONLY" = "true" ]; then
            npm run update:rentals -- --enrich-only
          else
            npm run update:rentals -- \
              --pages="$PAGES" \
              --delay="$DELAY" \
              --sources="$SOURCES"
          fi

      # A GITHUB_TOKEN push does not start Deploy to GitHub Pages; that workflow
      # listens for this job via workflow_run.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rentals.json src/data/geocode-cache.json src/data/listing-dates-cache.json
          if git diff --staged --quiet; then
            echo "No listing changes."
            exit 0
          fi
          git commit -m "chore: refresh rentals snapshot ($(date -u +%Y-%m-%d))"
          git push
