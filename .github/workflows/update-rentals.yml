name: Update rentals snapshot

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages per city × source (keep small to avoid load)'
        required: false
        default: '2'
        type: string
      delay:
        description: 'Delay between requests (ms)'
        required: false
        default: '1800'
        type: string
      sources:
        description: 'Sources: suumo,yahoo'
        required: false
        default: 'suumo,yahoo'
        type: string
      enrich_only:
        description: 'Only recompute coords / car minutes (no scrape)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-rentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch / enrich listings
        run: |
          if [ "${{ inputs.enrich_only }}" = "true" ]; then
            npm run update:rentals -- --enrich-only
          else
            npm run update:rentals -- \
              --pages=${{ inputs.pages }} \
              --delay=${{ inputs.delay }} \
              --sources=${{ inputs.sources }}
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rentals.json src/data/geocode-cache.json
          if git diff --staged --quiet; then
            echo "No listing changes."
            exit 0
          fi
          git commit -m "chore: refresh rentals snapshot ($(date -u +%Y-%m-%d))"
          git push
